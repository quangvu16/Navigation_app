<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" width="1040" height="780" font-family="Roboto, Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">VacuumNav app screens and navigation</title>
  <desc id="d">Five fixed bottom-nav tabs (Home, Map, Drive, Zones, Schedule), Home's sub-screens (Maps, History, Diagnostics) and dialogs (Connect, Robot Wi-Fi), with back behavior.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B57D0"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B57D0"/>
      <stop offset="1" stop-color="#4285F4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1040" height="780" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1040" height="74" fill="url(#hdr)"/>
  <text x="30" y="36" font-size="24" font-weight="700" fill="#FFFFFF">VacuumNav — app screens</text>
  <text x="30" y="60" font-size="13" fill="#D2E3FC">Jetpack Compose · 5 fixed bottom-nav tabs · sub-screens of Home · route keys frozen (Nav Read in MOBILE-DESIGN.md)</text>

  <!-- Home -->
  <g>
    <rect x="40" y="140" width="250" height="150" rx="14" fill="#E8F0FE" stroke="#0B57D0" stroke-width="2"/>
    <text x="165" y="174" font-size="17" font-weight="700" fill="#0B57D0" text-anchor="middle">Home</text>
    <text x="60" y="204" font-size="12.5" fill="#3C4043">• greeting + transport chip (SIM·</text>
    <text x="60" y="224" font-size="12.5" fill="#3C4043">  Wi-Fi·BLE) → opens Connect</text>
    <text x="60" y="248" font-size="12.5" fill="#3C4043">• robot card: battery, state pill</text>
    <text x="60" y="270" font-size="12.5" fill="#3C4043">• Routines · last clean · next run</text>
  </g>

  <!-- Sub-screens -->
  <g>
    <rect x="430" y="92" width="270" height="84" rx="12" fill="#F8F9FA" stroke="#5F6368" stroke-width="1.5"/>
    <text x="565" y="120" font-size="15" font-weight="700" fill="#202124" text-anchor="middle">Maps (sub-screen)</text>
    <text x="565" y="146" font-size="12.5" fill="#3C4043" text-anchor="middle">save / load floors · rename · export · import</text>

    <rect x="430" y="196" width="270" height="84" rx="12" fill="#F8F9FA" stroke="#5F6368" stroke-width="1.5"/>
    <text x="565" y="224" font-size="15" font-weight="700" fill="#202124" text-anchor="middle">History (sub-screen)</text>
    <text x="565" y="250" font-size="12.5" fill="#3C4043" text-anchor="middle">past runs: time, area, coverage · clear</text>

    <rect x="430" y="300" width="270" height="84" rx="12" fill="#F8F9FA" stroke="#5F6368" stroke-width="1.5"/>
    <text x="565" y="328" font-size="15" font-weight="700" fill="#202124" text-anchor="middle">Diagnostics (sub-screen)</text>
    <text x="565" y="354" font-size="12.5" fill="#3C4043" text-anchor="middle">link rates · config · copy report</text>
    <text x="565" y="374" font-size="12.5" font-weight="700" fill="#0B57D0" text-anchor="middle">Firmware (OTA): WFO1 URL update</text>
  </g>

  <!-- Home -> sub-screen arrows -->
  <path d="M 290 178 L 430 134" stroke="#0B57D0" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <path d="M 290 214 L 430 238" stroke="#0B57D0" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <path d="M 290 250 L 430 342" stroke="#0B57D0" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <text x="330" y="150" font-size="12" fill="#0B57D0">tap</text>
  <text x="330" y="238" font-size="12" fill="#0B57D0">tap</text>
  <text x="330" y="310" font-size="12" fill="#0B57D0">tap</text>

  <!-- Back arrow -->
  <path d="M 430 404 C 330 440, 240 400, 165 296" stroke="#1E8E3E" stroke-width="2.2" stroke-dasharray="7 5" fill="none" marker-end="url(#arr)"/>
  <text x="240" y="432" font-size="12.5" font-weight="700" fill="#1E8E3E">Android back / TopAppBar ↑ → Home</text>

  <!-- Dialogs -->
  <g>
    <rect x="40" y="340" width="250" height="76" rx="12" fill="#FEF7E0" stroke="#B06000" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="165" y="368" font-size="14.5" font-weight="700" fill="#B06000" text-anchor="middle">Connect dialog</text>
    <text x="165" y="394" font-size="12.5" fill="#3C4043" text-anchor="middle">SIM · Wi-Fi (IP / hoverboard.local) · BLE</text>
    <path d="M 100 290 L 120 340" stroke="#5F6368" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <rect x="40" y="448" width="250" height="84" rx="12" fill="#FEF7E0" stroke="#B06000" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="165" y="476" font-size="14.5" font-weight="700" fill="#B06000" text-anchor="middle">Robot Wi-Fi (dialog)</text>
    <text x="165" y="502" font-size="12.5" fill="#3C4043" text-anchor="middle">phone scan → pick → password</text>
    <text x="165" y="522" font-size="12.5" font-weight="700" fill="#0B57D0" text-anchor="middle">Save on robot → WFC1 → NVS</text>
    <path d="M 165 416 L 165 448" stroke="#5F6368" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="176" y="436" font-size="11.5" fill="#5F6368">Choose…</text>
  </g>

  <!-- Tab roots panel -->
  <g>
    <rect x="40" y="578" width="960" height="118" rx="14" fill="#F8F9FA" stroke="#202124" stroke-width="1.6"/>
    <text x="60" y="606" font-size="14.5" font-weight="700" fill="#202124">Bottom navigation — 5 tabs, order and icons are frozen</text>

    <rect x="60" y="624" width="172" height="56" rx="10" fill="#D2E3FC" stroke="#0B57D0" stroke-width="1.6"/>
    <text x="146" y="648" font-size="14" font-weight="700" fill="#0B57D0" text-anchor="middle">Home</text>
    <text x="146" y="668" font-size="11.5" fill="#3C4043" text-anchor="middle">robot card + routines</text>

    <rect x="244" y="624" width="172" height="56" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.4"/>
    <text x="330" y="648" font-size="14" font-weight="700" fill="#202124" text-anchor="middle">Map</text>
    <text x="330" y="668" font-size="11.5" fill="#3C4043" text-anchor="middle">long-press goal · Explore · Rooms</text>

    <rect x="428" y="624" width="172" height="56" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.4"/>
    <text x="514" y="648" font-size="14" font-weight="700" fill="#202124" text-anchor="middle">Drive</text>
    <text x="514" y="668" font-size="11.5" fill="#3C4043" text-anchor="middle">deadman joystick · E-STOP</text>

    <rect x="612" y="624" width="172" height="56" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.4"/>
    <text x="698" y="648" font-size="14" font-weight="700" fill="#202124" text-anchor="middle">Zones</text>
    <text x="698" y="668" font-size="11.5" fill="#3C4043" text-anchor="middle">drag red no-go quads</text>

    <rect x="796" y="624" width="172" height="56" rx="10" fill="#FFFFFF" stroke="#5F6368" stroke-width="1.4"/>
    <text x="882" y="648" font-size="14" font-weight="700" fill="#202124" text-anchor="middle">Schedule</text>
    <text x="882" y="668" font-size="11.5" fill="#3C4043" text-anchor="middle">FAB → time picker</text>
  </g>

  <!-- Home links to tab panel -->
  <path d="M 165 290 L 165 578" stroke="#5F6368" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="176" y="470" font-size="11.5" fill="#5F6368">Home is the</text>
  <text x="176" y="488" font-size="11.5" fill="#5F6368">first tab</text>

  <text x="520" y="736" font-size="12.5" fill="#5F6368" text-anchor="middle">Tab roots render side-by-side (state preserved per tab); sub-screens are pushed from Home only — a 7th tab was never added.</text>
  <text x="520" y="760" font-size="12.5" fill="#5F6368" text-anchor="middle">Destructive actions (Clear history, Delete map, Clear zones) always confirm first.</text>
</svg>
