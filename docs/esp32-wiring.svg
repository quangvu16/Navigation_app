<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" width="1120" height="820" font-family="Roboto, Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ESP32 wiring for vacuum_phone_esp32</title>
  <desc id="d">ESP32-WROOM DevKit wired to the LD14 lidar, hoverboard mainboard UART, MPU9250 IMU, three HC-SR04 sonars, buzzer and three LEDs, with power-rail notes.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B06000"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B57D0"/>
      <stop offset="1" stop-color="#4285F4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1120" height="820" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1120" height="74" fill="url(#hdr)"/>
  <text x="30" y="36" font-size="24" font-weight="700" fill="#FFFFFF">ESP32 wiring — vacuum_phone_esp32 (ESP32-WROOM DevKit)</text>
  <text x="30" y="60" font-size="13" fill="#D2E3FC">Pin map = firmware/vacuum_phone_esp32/config.h · verify against your board revision before powering</text>

  <!-- Variant + do-not-wire notes -->
  <rect x="30" y="92" width="520" height="64" rx="10" fill="#E8F0FE" stroke="#0B57D0" stroke-width="1.2"/>
  <text x="46" y="114" font-size="12.5" font-weight="700" fill="#0B57D0">ESP32-S3 variant (config.h, #if CONFIG_IDF_TARGET_ESP32S3):</text>
  <text x="46" y="136" font-size="12" fill="#3C4043">mainboard 6/7 · buzzer 21 · front sonar 1/2 · left 17/10 · right 18/11 · IMU 8/9</text>

  <rect x="570" y="92" width="520" height="64" rx="10" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.2"/>
  <text x="586" y="114" font-size="12.5" font-weight="700" fill="#B3261E">Never wire anything to:</text>
  <text x="586" y="136" font-size="12" fill="#3C4043">GPIO 6–11 (WROOM flash) · 12 (strapping) · 0 (bootloader) · 1/3 (UART0) · 34–39 (input-only)</text>

  <!-- ESP32 center -->
  <g>
    <rect x="380" y="210" width="360" height="400" rx="18" fill="#F8F9FA" stroke="#202124" stroke-width="2"/>
    <rect x="380" y="210" width="360" height="56" rx="18" fill="#202124"/>
    <rect x="380" y="244" width="360" height="22" fill="#202124"/>
    <text x="560" y="246" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">ESP32 DevKit (WROOM-32)</text>

    <!-- left pin column -->
    <g font-size="13" fill="#202124">
      <rect x="400" y="288" width="160" height="30" rx="7" fill="#E8F0FE"/>
      <text x="412" y="308" font-weight="700">GPIO16 ← LiDAR RX</text>
      <rect x="400" y="330" width="160" height="30" rx="7" fill="#E8F0FE"/>
      <text x="412" y="350" font-weight="700">GPIO26 ← mainboard TX</text>
      <rect x="400" y="372" width="160" height="30" rx="7" fill="#E8F0FE"/>
      <text x="412" y="392" font-weight="700">GPIO27 → mainboard RX</text>
      <rect x="400" y="414" width="160" height="30" rx="7" fill="#E6F4EA"/>
      <text x="412" y="434" font-weight="700">GPIO21 SDA (I2C)</text>
      <rect x="400" y="456" width="160" height="30" rx="7" fill="#E6F4EA"/>
      <text x="412" y="476" font-weight="700">GPIO22 SCL (I2C)</text>
      <rect x="400" y="498" width="160" height="30" rx="7" fill="#FEF7E0"/>
      <text x="412" y="518" font-weight="700">GPIO25 BUZZER (high)</text>
      <rect x="400" y="546" width="160" height="44" rx="7" fill="#F1F3F4"/>
      <text x="412" y="564" font-weight="700">5V · 3V3 · GND</text>
      <text x="412" y="582" font-size="11.5" fill="#5F6368">USB for flashing/serial</text>
    </g>

    <!-- right pin column -->
    <g font-size="13" fill="#202124">
      <rect x="574" y="288" width="152" height="30" rx="7" fill="#FCE8E6"/>
      <text x="584" y="308" font-weight="700">32/33 F: TRIG/ECHO</text>
      <rect x="574" y="330" width="152" height="30" rx="7" fill="#FCE8E6"/>
      <text x="584" y="350" font-weight="700">17/19 L: TRIG/ECHO</text>
      <rect x="574" y="372" width="152" height="30" rx="7" fill="#FCE8E6"/>
      <text x="584" y="392" font-weight="700">18/23 R: TRIG/ECHO</text>
      <rect x="574" y="414" width="152" height="30" rx="7" fill="#E6F4EA"/>
      <text x="584" y="434" font-weight="700">GPIO14 LED left</text>
      <rect x="574" y="456" width="152" height="30" rx="7" fill="#E6F4EA"/>
      <text x="584" y="476" font-weight="700">GPIO13 LED right</text>
      <rect x="574" y="498" width="152" height="30" rx="7" fill="#E6F4EA"/>
      <text x="584" y="518" font-weight="700">GPIO5 LED back</text>
      <text x="574" y="556" font-size="11.5" fill="#5F6368">firmware compiles a static pin check —</text>
      <text x="574" y="574" font-size="11.5" fill="#5F6368">duplicate/illegal pins fail the build</text>
    </g>
  </g>

  <!-- LD14 lidar -->
  <g>
    <rect x="40" y="238" width="250" height="104" rx="12" fill="#E8F0FE" stroke="#0B57D0" stroke-width="1.6"/>
    <text x="60" y="266" font-size="15" font-weight="700" fill="#0B57D0">LD14 LiDAR</text>
    <text x="60" y="292" font-size="12.5" fill="#3C4043">TX ─────→ GPIO16 (UART1, RX only)</text>
    <text x="60" y="314" font-size="12.5" fill="#3C4043">5 V + GND from the robot rail</text>
    <text x="60" y="334" font-size="11.5" fill="#5F6368">one-way: board never talks to the lidar</text>
    <path d="M 290 268 L 400 296" stroke="#5F6368" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Hoverboard mainboard -->
  <g>
    <rect x="40" y="430" width="250" height="132" rx="12" fill="#E8F0FE" stroke="#0B57D0" stroke-width="1.6"/>
    <text x="60" y="458" font-size="15" font-weight="700" fill="#0B57D0">Hoverboard mainboard</text>
    <text x="60" y="484" font-size="12.5" fill="#3C4043">TX ─────→ GPIO26  (USART2, 115200)</text>
    <text x="60" y="506" font-size="12.5" fill="#3C4043">RX ←───── GPIO27</text>
    <text x="60" y="530" font-size="12.5" fill="#3C4043">common GND with the ESP32</text>
    <text x="60" y="552" font-size="12" font-weight="700" fill="#B3261E">⚠ never connect the mainboard VCC</text>
    <path d="M 290 470 L 400 344" stroke="#5F6368" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- MPU9250 -->
  <g>
    <rect x="830" y="238" width="250" height="104" rx="12" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.6"/>
    <text x="850" y="266" font-size="15" font-weight="700" fill="#1E8E3E">MPU9250 (I2C)</text>
    <text x="850" y="292" font-size="12.5" fill="#3C4043">SDA → GPIO21 · SCL → GPIO22</text>
    <text x="850" y="314" font-size="12.5" fill="#3C4043">VCC 3V3 · GND common</text>
    <text x="850" y="334" font-size="11.5" fill="#5F6368">fusion runs in every HBT2 frame</text>
    <path d="M 830 290 L 740 424" stroke="#5F6368" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Sonars -->
  <g>
    <rect x="830" y="386" width="250" height="176" rx="12" fill="#FCE8E6" stroke="#B3261E" stroke-width="1.6"/>
    <text x="850" y="414" font-size="15" font-weight="700" fill="#B3261E">HC-SR04 sonars ×3 (5 V)</text>
    <text x="850" y="442" font-size="12.5" fill="#3C4043">Front  TRIG 32 / ECHO 33</text>
    <text x="850" y="466" font-size="12.5" fill="#3C4043">Left   TRIG 17 / ECHO 19</text>
    <text x="850" y="490" font-size="12.5" fill="#3C4043">Right  TRIG 18 / ECHO 23</text>
    <text x="850" y="518" font-size="12" font-weight="700" fill="#B3261E">⚠ ECHO is 5 V — level-shift to 3.3 V</text>
    <text x="850" y="540" font-size="11.5" fill="#5F6368">5 V + GND per sensor · reflex: STOP mode</text>
    <path d="M 830 440 L 740 304" stroke="#5F6368" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Buzzer -->
  <g>
    <rect x="40" y="626" width="250" height="80" rx="12" fill="#FEF7E0" stroke="#B06000" stroke-width="1.6"/>
    <text x="60" y="654" font-size="15" font-weight="700" fill="#B06000">Buzzer</text>
    <text x="60" y="680" font-size="12.5" fill="#3C4043">GPIO25, active-HIGH (drive module)</text>
    <path d="M 290 646 L 400 528" stroke="#5F6368" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- LEDs -->
  <g>
    <rect x="830" y="626" width="250" height="80" rx="12" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.6"/>
    <text x="850" y="654" font-size="15" font-weight="700" fill="#1E8E3E">Turn/stop LEDs (series resistors)</text>
    <text x="850" y="680" font-size="12.5" fill="#3C4043">left → 14 · right → 13 · back → 5</text>
    <path d="M 830 646 L 740 524" stroke="#5F6368" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Power band -->
  <rect x="40" y="734" width="1040" height="70" rx="12" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.4"/>
  <text x="60" y="760" font-size="13.5" font-weight="700" fill="#202124">Power &amp; grounds</text>
  <text x="60" y="784" font-size="12.5" fill="#3C4043">LiDAR (5 V, ~200 mA) and the HC-SR04s come off the ROBOT's 5 V rail — not the DevKit 5 V while flashing on USB. Every ground (lidar, mainboard, sonars, LEDs) joins the ESP32 GND. Never feed the mainboard's VCC pin.</text>
</svg>
