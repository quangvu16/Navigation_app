<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" width="1040" height="740" font-family="Roboto, Inter, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Connection map: VacuumNav Android app and ESP32</title>
  <desc id="d">The phone talks to the ESP32 over UDP ports 9900-9902 on a Wi-Fi network, or over Bluetooth LE without any network; the ESP32 joins the network chosen in the app and pulls firmware from the internet for OTA.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B57D0"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E8E3E"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B57D0"/>
      <stop offset="1" stop-color="#4285F4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1040" height="740" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1040" height="74" fill="url(#hdr)"/>
  <text x="32" y="36" font-size="24" font-weight="700" fill="#FFFFFF">VacuumNav ⇄ ESP32 — how the app connects to the robot</text>
  <text x="32" y="60" font-size="13" fill="#D2E3FC">UDP on the LAN (ports 9900–9902) or Bluetooth LE — same v2 datagrams either way</text>

  <!-- Internet cloud (OTA pull) -->
  <g>
    <ellipse cx="860" cy="130" rx="120" ry="46" fill="#E8F0FE" stroke="#0B57D0" stroke-width="1.6"/>
    <text x="860" y="124" font-size="14" font-weight="700" fill="#0B57D0" text-anchor="middle">Internet</text>
    <text x="860" y="146" font-size="11.5" fill="#3C4043" text-anchor="middle">hosts the firmware .bin</text>
    <path d="M 860 178 L 860 260" stroke="#1E8E3E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrG)" fill="none"/>
    <text x="874" y="226" font-size="12" fill="#1E8E3E">WFO1 pull-OTA</text>
    <text x="874" y="244" font-size="11" fill="#5F6368">board downloads the image</text>
  </g>

  <!-- Router -->
  <g>
    <rect x="330" y="96" width="300" height="112" rx="14" fill="#E8F0FE" stroke="#0B57D0" stroke-width="1.8"/>
    <text x="480" y="126" font-size="15" font-weight="700" fill="#0B57D0" text-anchor="middle">Wi-Fi network (public / home LAN)</text>
    <text x="480" y="150" font-size="12" fill="#3C4043" text-anchor="middle">phone + robot join the same network</text>
    <text x="480" y="172" font-size="11.5" fill="#5F6368" text-anchor="middle">fallback: robot's own AP "VacuumBot"</text>
    <text x="480" y="192" font-size="11.5" fill="#5F6368" text-anchor="middle">mDNS: hoverboard.local · _vacuum._udp</text>
  </g>

  <!-- Phone -->
  <g>
    <rect x="40" y="300" width="300" height="330" rx="16" fill="#F8F9FA" stroke="#5F6368" stroke-width="1.6"/>
    <rect x="40" y="300" width="300" height="52" rx="16" fill="#0B57D0"/>
    <rect x="40" y="330" width="300" height="22" fill="#0B57D0"/>
    <text x="190" y="333" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Android phone — VacuumNav app</text>
    <text x="64" y="384" font-size="13" font-weight="700" fill="#202124">The whole brain lives here:</text>
    <text x="64" y="410" font-size="12.5" fill="#3C4043">• SLAM + EKF localization (vacuum_core)</text>
    <text x="64" y="432" font-size="12.5" fill="#3C4043">• A* planning · coverage · rooms · docking</text>
    <text x="64" y="454" font-size="12.5" fill="#3C4043">• UI: Home / Map / Drive / Zones / Schedule</text>
    <text x="64" y="484" font-size="13" font-weight="700" fill="#202124">Controls &amp; safety in the app:</text>
    <text x="64" y="510" font-size="12.5" fill="#3C4043">• deadman joystick — release = stop</text>
    <text x="64" y="532" font-size="12.5" fill="#3C4043">• always-visible E-STOP · collision layer</text>
    <text x="64" y="554" font-size="12.5" fill="#3C4043">• settings: pick the robot's Wi-Fi (WFC1)</text>
    <text x="64" y="576" font-size="12.5" fill="#3C4043">• Diagnostics → Firmware update (WFO1)</text>
    <text x="64" y="608" font-size="11.5" fill="#5F6368">Transports: SIM (no hardware) · UDP · BLE</text>
  </g>

  <!-- ESP32 -->
  <g>
    <rect x="700" y="300" width="300" height="330" rx="16" fill="#F8F9FA" stroke="#5F6368" stroke-width="1.6"/>
    <rect x="700" y="300" width="300" height="52" rx="16" fill="#202124"/>
    <rect x="700" y="330" width="300" height="22" fill="#202124"/>
    <text x="850" y="333" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">ESP32 — vacuum_phone_esp32</text>
    <text x="724" y="384" font-size="13" font-weight="700" fill="#202124">Real-time I/O + safety only:</text>
    <text x="724" y="410" font-size="12.5" fill="#3C4043">• LDS2 lidar → phone (one per revolution)</text>
    <text x="724" y="432" font-size="12.5" fill="#3C4043">• HBT2 telemetry @50 Hz · HBC2 @20 Hz</text>
    <text x="724" y="454" font-size="12.5" fill="#3C4043">• MPU9250 IMU · 3× sonar reflex</text>
    <text x="724" y="484" font-size="13" font-weight="700" fill="#202124">Independent of the phone:</text>
    <text x="724" y="510" font-size="12.5" fill="#B3261E">• 300 ms command watchdog → stop</text>
    <text x="724" y="532" font-size="12.5" fill="#B3261E">• latched E-STOP survives link loss</text>
    <text x="724" y="554" font-size="12.5" fill="#3C4043">• Wi-Fi credentials in NVS (WFC1)</text>
    <text x="724" y="576" font-size="12.5" fill="#3C4043">• OTA: push :3232 or pull from URL</text>
    <text x="724" y="608" font-size="11.5" fill="#5F6368">drives: mainboard UART · sonars · LEDs · buzzer</text>
  </g>

  <!-- Phone <-> Router -->
  <path d="M 190 300 L 190 240 L 330 208" stroke="#5F6368" stroke-width="2.2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="130" y="264" font-size="12.5" fill="#3C4043">joins the network</text>

  <!-- Router <-> ESP32 -->
  <path d="M 630 178 L 760 240 L 820 300" stroke="#5F6368" stroke-width="2.2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="700" y="234" font-size="12.5" fill="#3C4043">STA join — SSID chosen</text>
  <text x="700" y="252" font-size="12.5" fill="#3C4043">in the app (WFC1 → NVS)</text>

  <!-- Protocol lane: 9901 -->
  <g>
    <path d="M 348 372 L 692 372" stroke="#0B57D0" stroke-width="2.6" fill="none" marker-end="url(#arrB)"/>
    <rect x="368" y="336" width="312" height="30" rx="15" fill="#E8F0FE"/>
    <text x="524" y="356" font-size="12.5" font-weight="700" fill="#0B57D0" text-anchor="middle">9901 cmd — HELO/HACK · HBC2 20 Hz · PNG1</text>
  </g>
  <!-- 9901 admin -->
  <g>
    <path d="M 348 424 L 692 424" stroke="#0B57D0" stroke-width="2.6" fill="none" marker-end="url(#arrB)"/>
    <rect x="368" y="394" width="312" height="30" rx="15" fill="#E8F0FE"/>
    <text x="524" y="414" font-size="12.5" font-weight="700" fill="#0B57D0" text-anchor="middle">settings — WFC1 choose Wi-Fi · WFO1 OTA</text>
  </g>
  <!-- 9902 -->
  <g>
    <path d="M 692 476 L 348 476" stroke="#1E8E3E" stroke-width="2.6" fill="none" marker-end="url(#arrG)"/>
    <rect x="368" y="446" width="312" height="30" rx="15" fill="#E6F4EA"/>
    <text x="524" y="466" font-size="12.5" font-weight="700" fill="#1E8E3E" text-anchor="middle">9902 telem — HBT2 50 Hz · PNG2 · acks</text>
  </g>
  <!-- 9900 -->
  <g>
    <path d="M 692 528 L 348 528" stroke="#1E8E3E" stroke-width="2.6" fill="none" marker-end="url(#arrG)"/>
    <rect x="368" y="498" width="312" height="30" rx="15" fill="#E6F4EA"/>
    <text x="524" y="518" font-size="12.5" font-weight="700" fill="#1E8E3E" text-anchor="middle">9900 scan — LDS2 lidar (per revolution)</text>
  </g>

  <!-- BLE bypass -->
  <path d="M 190 630 C 190 700, 850 700, 850 630" stroke="#F9AB00" stroke-width="2.4" stroke-dasharray="8 6" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="336" y="676" width="368" height="34" rx="17" fill="#FEF7E0"/>
  <text x="520" y="698" font-size="12.5" font-weight="700" fill="#B06000" text-anchor="middle">Bluetooth LE alternative: same datagrams over GATT — no network needed</text>

  <text x="520" y="732" font-size="12" fill="#B3261E" text-anchor="middle">If the phone disappears, the ESP32 stops the wheels itself: 300 ms watchdog + latched E-stop.</text>
</svg>
